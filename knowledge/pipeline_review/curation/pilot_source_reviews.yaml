    confirmed_structure:
      - Task activations from the active verb-generation phase define six bilateral language ROIs.
      - CONN 16p and SPM8 preprocessing with CompCor and 0.008–0.08 Hz filtering feeds parallel ROI-to-ROI and seed-to-voxel task-condition analyses.
