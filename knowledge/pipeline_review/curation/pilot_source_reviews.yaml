schema_version: pilot_source_reviews_v1
review_date: '2026-09-22'
review_scope: >-
  Structural verification of the reported methods against locally archived full
  text. This is not yet a complete parameter-level scientific appraisal.
reviews:
  '37034165':
    primary_family: rsfmri_qc_preprocessing_denoising
    source_sections:
      - Software information
      - Preprocessing
      - Denoising
      - CONN quality control pipeline
    provisional_pipeline_count: 1
    split_decision: keep_as_single_qc_pipeline
    confirmed_structure:
      - BIDS data enter CONN 22.a default minimal preprocessing.
      - Default denoising follows preprocessing and feeds raw, preprocessing and denoising QC.
      - Visual and automated QC are cross-cutting gates rather than a terminal export step.
    unresolved:
      - Dataset-specific acquisition metadata and slice order vary across the multisite sample.
      - Some exclusion decisions remain visual and judgment-based.
    discrepancies: []

  '37162700':
    primary_family: longitudinal_pre_post
    source_sections:
      - Preprocessing
      - Region of interest-to-region of interest analysis
      - Seed-to-voxel (Whole Brain) analysis
      - Models of analyses
    provisional_pipeline_count: 1
    split_decision: keep_shared_preprocessing_with_parallel_analysis_branches
    confirmed_structure:
      - fMRIPrep and FSL processing precede import into CONN.
      - CONN smoothing and denoising feed parallel ROI-to-ROI and seed-to-voxel branches.
      - Both branches feed longitudinal factorial intervention comparisons.
    unresolved:
      - Exact session and condition encoding in the CONN project is not reported.
      - Acquisition parameters and executable batch configuration remain incomplete.
    discrepancies:
      - The legacy index labels the family as unclear, while the methods support longitudinal_pre_post.

  '37371347':
    primary_family: task_fmri_connectivity
    source_sections:
      - 2.3. Data Analysis
    provisional_pipeline_count: 1
    split_decision: keep_conn_connectivity_pipeline_with_linked_external_task_analyses
    confirmed_structure:
      - SPM12 performs task preprocessing and first-level GLM before CONN import.
      - CONN reuses SPM.mat, denoises the data and performs ROI-to-ROI connectivity.
      - Percent signal change and laterality are external linked analyses.
    unresolved:
      - Exact CONN version and the 23 ROI labels are absent.
      - Task-condition mapping and CONN statistical thresholds require confirmation.
    discrepancies: []

  '38161799':
    primary_family: rsfmri_seed_to_voxel
    source_sections:
