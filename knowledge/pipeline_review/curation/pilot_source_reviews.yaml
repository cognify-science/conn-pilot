      - ROI-to-ROI analyses
      - fALFF analyses
    provisional_pipeline_count: 1
    split_decision: keep_shared_processing_with_roi_and_falff_branches
    confirmed_structure:
      - CONN preprocessing and denoising feed ROI-to-ROI and fALFF branches.
      - fALFF ROI summaries feed an external R ANOVA with Bonferroni correction.
      - Structural segmentation has separate provenance and supplies related MTL definitions.
    unresolved:
