      - CAT12 cortical-complexity analysis precedes functional analysis and identifies superior-temporal-sulcus regions linked to autistic-like traits.
      - Matching left and right STSvp regions from the Glasser360 atlas become seeds for CONN seed-to-voxel analysis.
