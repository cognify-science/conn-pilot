    provisional_pipeline_count: 1
    split_decision: keep_as_single_seed_to_voxel_pipeline
    confirmed_structure:
      - CONN default volume preprocessing and aCompCor denoising precede seed-to-voxel analysis.
      - Bilateral thalamus seeds feed group comparisons and symptom regressions.
    unresolved:
