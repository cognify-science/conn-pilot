  '41306624':
    primary_family: machine_learning_features
    source_sections:
      - Image data preprocessing
      - Brain mapping
      - Feature extraction
      - Feature selection using genetic algorithm
      - Compare the performance of models
    provisional_pipeline_count: 1
    split_decision: keep_conn_feature_generation_linked_to_external_ml
    confirmed_structure:
      - CONN preprocessing precedes graph metrics for 15 ROIs and four task conditions.
      - Graph metrics and demographics form 420 candidate features.
      - Genetic feature selection and classifier comparison are external downstream stages.
    unresolved:
      - ROI definitions, denoising, connectivity metric and graph threshold are not sufficiently reported.
      - It is unclear whether feature selection is nested inside cross-validation.
    discrepancies:
      - Classification accuracy differs between the results table and discussion text; it cannot be used as a benchmark without resolution.

  '39333843':
    primary_family: rsfmri_voxel_to_voxel
    source_sections:
      - Data preparation and statistical analysis
      - Data preprocessing
      - Denoising
      - Quality control assessment
      - Multivariate pattern analysis
      - Seed-based analysis
      - Secondary analysis
    provisional_pipeline_count: 1
    split_decision: keep_as_one_data_driven_analysis_chain
    verified_analysis_components:
      - component_id: voxel_to_voxel_or_mvpa
        source_path: connectivity_analysis
      - component_id: seed_to_voxel
        source_path: connectivity_analysis
      - component_id: roi_to_roi
        source_path: connectivity_analysis
    derived_edges:
      - from_component: voxel_to_voxel_or_mvpa
        to_component: seed_to_voxel
        relation: derives
      - from_component: seed_to_voxel
        to_component: roi_to_roi
        relation: derives
    confirmed_structure:
      - CONN 22.a default preprocessing and denoising feed an eight-component fc-MVPA group comparison.
      - The fc-MVPA cluster becomes a seed for a post hoc seed-based analysis.
      - Clusters from the data-driven chain become ROIs for a secondary ROI-to-ROI comparison with controls.
    unresolved:
      - Data-derived seeds and ROIs are run outputs and must not be represented as fixed reusable atlas inputs.
    discrepancies:
      - The legacy rsfmri_seed_to_voxel label hides the preceding fc-MVPA stage and following ROI-to-ROI stage.
      - Legacy dynamic and graph labels are keyword false positives.

  '41707453':
    primary_family: rsfmri_seed_to_voxel
    software_overrides:
