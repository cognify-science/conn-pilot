    confirmed_structure:
      - SPM12 preprocesses motor-task fMRI and runs a task GLM feeding MarsBaR percent-signal-change measurements.
      - The same preprocessed task images are imported into CONN 22.a and denoised before fourteen-network-seed whole-brain connectivity analyses.
      - Task activation and seed-to-voxel connectivity are parallel branches compared between metastasis patients and matched HCP controls.
    unresolved:
      - Patient and control acquisitions, motor paradigms and run structures differ substantially and are not represented by a formal harmonization step.
      - The effect of applying a resting-style temporal band-pass filter to task data requires scientific appraisal.
    discrepancies:
      - The legacy clinical-group family hides that both branches operate on task fMRI.
      - Legacy dynamic and graph labels are keyword false positives.
      - Preprocessing was performed in SPM before CONN import, not by the CONN preprocessing pipeline.

