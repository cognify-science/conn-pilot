      - The exact default-atlas release should be versioned for reproducible seed labels.
    discrepancies:
      - The legacy extraction incorrectly reports the CONN version as missing.
      - PPI means prepulse inhibition in this paper and is not psychophysiological interaction analysis.
      - Legacy dynamic and graph labels are keyword false positives.

