  '38893128':
    primary_family: task_fmri_connectivity
    software_overrides:
      CONN: 22.a
      SPM: '12'
      MATLAB: R2020a
    source_sections:
      - 2.3. Paradigms
      - 2.4. Data Analysis
      - 2.5. Statistical Analysis
    provisional_pipeline_count: 1
    split_decision: keep_shared_spm_processing_with_activation_and_conn_branches
    execution_context_overrides:
