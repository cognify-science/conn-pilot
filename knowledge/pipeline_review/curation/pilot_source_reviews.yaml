  '40739609':
    primary_family: multimodal_structural_seed_connectivity
    source_sections:
      - VBM
      - ROI definition
      - Rs-fMRI data analysis
      - Statistical analysis
    provisional_pipeline_count: 1
    split_decision: keep_linked_vbm_and_seed_connectivity_branches
    verified_analysis_components:
      - component_id: structural_vbm
        source_path: review.source_sections
        execution_context: external
      - component_id: seed_to_voxel
        source_path: connectivity_analysis
    derived_edges:
      - from_component: structural_vbm
        to_component: seed_to_voxel
        relation: derives
    parameter_overrides:
      - component_id: reported_preprocessing
        name: functional_voxel_size
        value: 3 × 3 × 3 mm
      - component_id: reported_preprocessing
        name: art_motion_threshold
        value: '> 3 mm'
      - component_id: reported_preprocessing
        name: art_global_signal_threshold
        value: z > 12
      - component_id: reported_denoising
        name: bandpass_filter
        value: 0.01–0.08 Hz
    confirmed_structure:
      - DPARSF voxel-based morphometry identifies a left-insula gray-matter cluster, while the right-insula seed is selected independently from AAL.
      - The structural result and atlas definition produce two 10 mm spherical seeds for CONN 18 seed-to-voxel analysis.
      - CONN preprocessing, CompCor denoising and 0.01–0.08 Hz filtering feed three-group inference and PAS correlations.
    unresolved:
      - The executable handoff from the DPARSF VBM result to the left-insula seed is not supplied.
      - The exact DPARSF release and CONN batch files are unavailable.
    discrepancies:
      - The legacy dynamic label is a keyword false positive.
      - The legacy extraction omitted the explicitly reported band-pass filter and the dependency between VBM and seed definition.

