review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - ROI-to-ROI Analysis
  - Exploratory Network Analysis
  provisional_pipeline_count: 1
  split_decision: keep_targeted_roi_regression_with_exploratory_network_branch
  confirmed_structure:
  - CONN 20.b default preprocessing feeds a targeted eight-ROI estradiol regression.
  - A parallel exploratory 32-ROI network analysis tests years since final menstrual period using an MVPA
    omnibus cluster test.
  - Age is a nuisance covariate for the targeted model but is intentionally omitted from the correlated
    years-since-menopause model.
  unresolved:
  - Denoising regressors, temporal filter, SPM version and MATLAB version are not reported.
  - The supplementary ROI list is required to reconstruct the complete exploratory network model.
  discrepancies:
  - Targeted ROI-to-ROI and exploratory functional-network analyses use different ROI universes and covariate
    models and must remain separate branches.
  rejected_components: []
