review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Magnetic resonance imaging protocol and analysis
  - Functional connectivity analysis
  - Preprocessing and ROI selection
  provisional_pipeline_count: 1
  split_decision: keep_shared_task_processing_with_roi_and_seed_branches
  confirmed_structure:
  - Task activations from the active verb-generation phase define six bilateral language ROIs.
  - CONN 16p and SPM8 preprocessing with CompCor and 0.008–0.08 Hz filtering feeds parallel ROI-to-ROI
    and seed-to-voxel task-condition analyses.
  - Fisher-transformed connectivity enters group comparison and external neuropsychological associations.
  unresolved:
  - The task design and condition regressors are not described sufficiently to reproduce the first-level
    model.
  - Motion thresholds and the exact twelve ROI masks are not available as reusable files.
  discrepancies:
  - The legacy resting-state family is incorrect; the methods explicitly analyze an active task condition.
  - The legacy extraction reverses the explicit statement that global-signal regression was not applied.
  - Legacy graph and machine-learning labels are keyword false positives.
  rejected_components: []
