review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - VBM
  - ROI definition
  - Rs-fMRI data analysis
  - Statistical analysis
  provisional_pipeline_count: 1
  split_decision: keep_linked_vbm_and_seed_connectivity_branches
  confirmed_structure:
  - DPARSF voxel-based morphometry identifies a left-insula gray-matter cluster, while the right-insula
    seed is selected independently from AAL.
  - The structural result and atlas definition produce two 10 mm spherical seeds for CONN 18 seed-to-voxel
    analysis.
  - CONN preprocessing, CompCor denoising and 0.01–0.08 Hz filtering feed three-group inference and PAS
    correlations.
  unresolved:
  - The executable handoff from the DPARSF VBM result to the left-insula seed is not supplied.
  - The exact DPARSF release and CONN batch files are unavailable.
  discrepancies:
  - The legacy dynamic label is a keyword false positive.
  - The legacy extraction omitted the explicitly reported band-pass filter and the dependency between
    VBM and seed definition.
  rejected_components: []
