review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Imaging
  - Motor task
  - Data analysis
  provisional_pipeline_count: 1
  split_decision: keep_as_baseline_motor_task_ppi_pipeline
  confirmed_structure:
  - A right-hand motor block design supplies the psychological regressor for bilateral VTA PPI models.
  - CONN preprocessing and aCompCor denoising feed seed-to-voxel PPI interaction maps.
  - Baseline group differences and associations with baseline and follow-up motor change are tested with
    age and gender covariates.
  unresolved:
  - CONN, SPM and MATLAB versions, ART thresholds and exact CompCor dimensions are not reported.
  - Band-pass filtering of task data and the use of baseline PPI to predict later change require scientific
    appraisal before recommendation.
  discrepancies:
  - Only baseline imaging enters the PPI analysis; follow-up motor score is an outcome rather than a longitudinal
    imaging condition.
  rejected_components: []
