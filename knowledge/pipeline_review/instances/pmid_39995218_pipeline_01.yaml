review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: true
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Brain imaging
  - Preprocessing
  - Denoising
  - Timecourse extraction
  - Static functional connectivity analysis
  - Dynamic functional connectivity analysis
  provisional_pipeline_count: 2
  split_decision: keep_targeted_roi_and_neuromark_dynamic_branches
  confirmed_structure:
  - SPM fieldmap-aware preprocessing and CONN segmentation, smoothing and denoising prepare resting-state
    and breath-counting runs without frame scrubbing.
  - One branch uses targeted DMN, CEN and salience ROIs; a second uses 53 individualized Neuromark ICA
    networks.
  - Sliding-window matrices are clustered jointly into four states, followed by dwell, episode, occupancy
    and transition metrics and on-task/off-task models.
  - Window-length, task-versus-rest clustering and held-out-data sensitivity analyses test state stability.
  unresolved:
  - CONN, GIFT, TAPAS and MATLAB versions are not reported.
  - Combined task/rest state estimation can leak condition structure into cluster definition; the reported
    split and held-out sensitivity results must remain attached to interpretation.
  discrepancies:
  - The dynamic analysis executes in GIFT after CONN time-course preparation and is therefore a hybrid
    multi-tool pipeline.
  rejected_components: []
