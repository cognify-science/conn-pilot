review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Data collection and pre-processing
  - Network construction
  - Graph analysis
  - Statistical analysis
  provisional_pipeline_count: 1
  split_decision: keep_external_spm_and_custom_graph_pipeline
  confirmed_structure:
  - SPM12 preprocessing and CONN CompCor denoising feed a weighted 384-region AICHA ROI matrix.
  - Custom MATLAB code constructs weighted undirected graphs using separate positive-only and absolute-correlation
    analyses.
  - Global topology, nodal strength, betweenness centrality and hub status are tested with threshold-sensitivity
    analyses.
  unresolved:
  - CONN, CAT12 and MATLAB versions are not reported.
  - Surrogate-network generation and custom graph scripts are unavailable, limiting exact reproduction.
  discrepancies:
  - Graph construction and metrics execute in custom MATLAB rather than the CONN graph module.
  rejected_components:
  - conn_preprocessing
