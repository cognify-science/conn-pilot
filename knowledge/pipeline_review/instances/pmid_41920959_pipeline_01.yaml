review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Anatomical image processing
  - Functional image processing
  - Statistical analysis
  provisional_pipeline_count: 1
  split_decision: keep_parallel_structural_and_roi_connectivity_branches
  confirmed_structure:
  - BIDS-organized images feed a FreeSurfer cortical-thickness and subcortical-volume branch with manual
    quality correction.
  - In parallel, CONN 22.a preprocessing and aCompCor denoising feed ROI-to-ROI matrices over 58 a priori
    atlas regions.
  - Network-based statistics relate the ROI network to suicidal-ideation severity, while structural models
    test parallel dimensional associations.
  unresolved:
  - The full 58-ROI definition is only available in supplementary material and is not packaged as a reusable
    atlas file.
  - Medication and illness-chronicity confounds are not modeled because of sample size.
  discrepancies:
  - The legacy extraction reports 10 mm functional smoothing, but the methods specify 5 mm for FreeSurfer
    and 8 mm for functional data.
  - The legacy extraction reverses the explicit statement that global-signal regression was not applied.
  - Legacy dynamic and graph labels are keyword false positives.
  rejected_components:
  - dynamic_connectivity
  - graph_theory
