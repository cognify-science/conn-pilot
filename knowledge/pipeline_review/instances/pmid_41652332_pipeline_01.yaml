review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Structural MRI analysis
  - Functional connectivity analysis
  provisional_pipeline_count: 1
  split_decision: keep_linked_morphometry_and_parallel_connectivity_branches
  confirmed_structure:
  - FreeSurfer cortical-thickness and subcortical-volume analyses identify right IFG and left SFG structural
    differences.
  - Those structural findings define two seeds for CONN 23.a functional connectivity.
  - Shared preprocessing and denoising feed reported ROI-target and seed-to-voxel analyses, group contrasts
    and clinical GLMs.
  unresolved:
  - The methods alternate between ROI-to-ROI targets and correlations with all brain voxels, so the exact
    executed CONN analysis spaces require project-level confirmation.
  - ART thresholds, CompCor component counts and MATLAB version are not reported.
  discrepancies:
  - The legacy extraction misses CONN 23.a, FreeSurfer 7.4.1 and the explicitly reported 8 mm functional
    smoothing kernel.
  - Legacy dynamic, graph and machine-learning labels are keyword false positives.
  rejected_components:
  - dynamic_connectivity
  - graph_theory
  - machine_learning
