review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - fMRI Data Pre-Processing
  - ROI Regions Selection
  - ROI-to-ROI FC Analysis
  - Correlation Analysis
  provisional_pipeline_count: 1
  split_decision: keep_as_resting_state_aal_roi_matrix
  confirmed_structure:
  - CONN 16b and SPM8 preprocess and denoise resting-state data with scrubbing and temporal filtering.
  - Ninety AAL cerebrum ROIs define a 90 × 90 Fisher-transformed connectivity matrix.
  - FDR-corrected group differences feed external symptom and illness-duration correlations.
  unresolved:
  - ART thresholds, CompCor dimensions and global-signal treatment are not reported.
  - The formula printed for bivariate correlation appears typeset incorrectly and should not be used as
    an executable specification.
  discrepancies:
  - Despite its legacy task-fMRI label, acquisition and analysis are explicitly resting state.
  - No graph-theory or dynamic-connectivity analysis is reported.
  rejected_components:
  - task_connectivity
  - dynamic_connectivity
  - graph_theory
