review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - 2. Materials and Methods
  provisional_pipeline_count: 1
  split_decision: keep_prior_structural_parcellation_linked_to_seed_maps
  confirmed_structure:
  - Nineteen bilateral insular ROIs from prior diffusion tractography are registered with ANTs and consolidated
    into six functional subregions.
  - CONN 18.a preprocessing and aCompCor denoising feed seed-to-voxel maps for the original and merged
    insular subdivisions.
  - Cross-sectional within-group inference maps the functional connectivity profile of healthy adults.
  unresolved:
  - The prior tractography parcellation and ANTs transform files are required external dependencies.
  - Merging regions based on observed connectivity profiles needs a frozen derivation record to avoid
    circular reuse.
  discrepancies:
  - The study is cross-sectional; the legacy longitudinal label is unsupported.
  rejected_components:
  - longitudinal_design
