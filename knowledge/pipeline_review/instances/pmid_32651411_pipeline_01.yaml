review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Functional MRI data preprocessing
  - Whole-brain functional connectivity analysis of large-scale networks
  - Functional connectivity analysis of basal ganglia
  - Structural MRI data analysis
  provisional_pipeline_count: 1
  split_decision: keep_parallel_vbm_and_roi_connectivity_branches
  confirmed_structure:
  - CONN 17 preprocesses three resting-state runs and retains participants with more than 250 valid scans.
  - A 32-ROI large-scale-network analysis and an atlas-based basal-ganglia ROI analysis feed group contrasts
    and impulsivity correlations.
  - A parallel SPM12 voxel-based morphometry branch tests gray-matter differences with 8 mm smoothing.
  unresolved:
  - The exact intermediate ART thresholds and nuisance-regression terms are described as defaults rather
    than enumerated.
  - The 32 network ROIs depend on the atlas distributed with the historical CONN release.
  discrepancies:
  - The legacy extraction misses the explicitly reported CONN 17 version.
  - The paper performs ROI-to-ROI network analysis, not graph-theory analysis.
  - The legacy clinical-group family omits the parallel VBM branch.
  rejected_components:
  - graph_theory
