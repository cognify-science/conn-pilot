review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - The Stroop colour-word paradigm
  - Regions of Interest (ROI)
  - Preprocessing
  - Denoising
  - Quality assessment (QA) of the denoised data
  - Statistical analysis
  provisional_pipeline_count: 1
  split_decision: keep_condition_weighted_roi_matrix_with_qc_gate
  confirmed_structure:
  - Two Stroop task sessions encode pre-fatigue and post-fatigue conditions over 67 atlas and brainstem
    ROIs.
  - Condition-weighted ROI-to-ROI models follow extensive nuisance regression and high-pass filtering.
  - QC-FC, degrees of freedom and subject-level outlier measures gate 10 of 78 participants before group
    and condition contrasts.
  unresolved:
  - The statistical description mixes ROI-to-ROI matrices with voxel and cluster terminology, requiring
    project-level confirmation of the exact second-level option.
  - Brainstem ROI files are supplementary dependencies and must be versioned for reuse.
  discrepancies:
  - This is condition-weighted task connectivity without a reported PPI model.
  - High-pass filtering is used instead of the resting-state band-pass filters common elsewhere in the
    corpus.
  rejected_components:
  - dynamic_connectivity
  - ppi_or_gppi
