review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - FUNCTIONAL MRI PREPROCESSING
  - ANALYSES OF HEAD MOTION
  - FUNCTIONAL CONNECTIVITY ANALYSES
  provisional_pipeline_count: 1
  split_decision: keep_roi_graph_with_hub_derived_seed_followup
  confirmed_structure:
  - SPM8 and Nipype preprocessing feeds CONN 13e correlations among 34 functionally defined ROIs.
  - Cost-thresholded graph analyses test global efficiency, local efficiency and betweenness centrality
    with signed-edge sensitivity checks.
  - A group-different hub identified by betweenness centrality becomes the seed for a follow-up whole-brain
    connectivity analysis.
  unresolved:
  - In-house preprocessing scripts and exact Nipype versions are unavailable.
  - The unusually long six-second TR is scientifically justified narratively but remains an acquisition
    constraint for reuse.
  discrepancies:
  - Seed-to-voxel analysis is downstream of the graph result and must not be represented as an independent
    prespecified seed analysis.
  rejected_components:
  - conn_preprocessing
