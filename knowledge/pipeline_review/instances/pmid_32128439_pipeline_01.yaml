review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - METHOD
  provisional_pipeline_count: 1
  split_decision: keep_external_spm_processing_with_auditory_roi_matrix
  confirmed_structure:
  - SPM12 preprocessing outside CONN is applied to HCP and tinnitus datasets acquired with different scanners
    and protocols.
  - CONN 18 computes bivariate ROI-to-ROI correlations among auditory cortical regions.
  - Fisher-transformed edges feed age-group and tinnitus comparisons with FDR correction.
  unresolved:
  - Smoothing FWHM, nuisance-regression model, motion thresholds and MATLAB version are not reported.
  - Scanner and acquisition differences are not represented by an explicit harmonization step.
  discrepancies:
  - The source explicitly reports FDR-corrected p < 0.05, contrary to the legacy missing-threshold flag.
  - Legacy dynamic and graph labels are keyword false positives.
  - The reported CONN version is 18; the legacy value 18.11 is unsupported by the methods text.
  rejected_components:
  - conn_preprocessing
  - dynamic_connectivity
  - graph_theory
