review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Preprocessing
  - Region of interest-to-region of interest analysis
  - Seed-to-voxel (Whole Brain) analysis
  - Models of analyses
  provisional_pipeline_count: 1
  split_decision: keep_shared_preprocessing_with_parallel_analysis_branches
  confirmed_structure:
  - fMRIPrep and FSL processing precede import into CONN.
  - CONN smoothing and denoising feed parallel ROI-to-ROI and seed-to-voxel branches.
  - Both branches feed longitudinal factorial intervention comparisons.
