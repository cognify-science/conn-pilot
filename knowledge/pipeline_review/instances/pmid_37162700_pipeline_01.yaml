  - Exact session and condition encoding in the CONN project is not reported.
  - Acquisition parameters and executable batch configuration remain incomplete.
  discrepancies:
  - The legacy index labels the family as unclear, while the methods support longitudinal_pre_post.
  rejected_components: []
