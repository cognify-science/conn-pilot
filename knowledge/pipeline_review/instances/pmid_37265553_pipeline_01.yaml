  confirmed_structure:
  - Baseline and post-contingency-management resting-state sessions share CONN 19c preprocessing and denoising.
  - ROI-to-ROI correlations are summarized into within-network means and between-network connectivity
    across five networks.
  - Longitudinal models test drinking reduction, HIV status and their associations with connectivity changes.
  unresolved:
  - The exact repeated-measures subject model and missing-session handling are not fully specified in
    the methods text.
  - Network masks are external parcellation dependencies and should be versioned.
  discrepancies:
  - The analysis contains both ROI-level and network-summary inference and should expose both outputs.
