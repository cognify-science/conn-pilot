review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Functional magnetic resonance imaging acquisition
  - Functional network construction
  - Statistical analyses
  provisional_pipeline_count: 1
  split_decision: keep_external_spm_processing_with_conn_roi_matrix
  confirmed_structure:
  - SPM12 preprocessing outside CONN feeds aCompCor nuisance regression and temporal filtering.
  - Harvard-Oxford, Schaefer-400 and Ascending Arousal Network atlases define a 430-region ROI-to-ROI
    matrix.
  - CONN GLMs evaluate food-addiction and sex contrasts; selected connections feed external clinical correlations.
  unresolved:
  - CONN and MATLAB versions are not reported.
  - The exact prior preprocessing protocol is partly delegated to earlier publications.
  discrepancies:
  - The legacy extraction reports 0.008–0.09 Hz, while the paper states 0.008–0.08 Hz.
  - The reported functional networks are ROI-to-ROI matrices without graph-theory metrics.
  - The legacy clinical-group family hides the actual ROI-to-ROI analysis family.
  rejected_components:
  - conn_preprocessing
  - graph_theory
