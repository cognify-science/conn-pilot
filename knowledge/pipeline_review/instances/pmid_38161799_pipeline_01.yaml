    - name: main_findings
      value:
      - Autistic participants showed stronger thalamic connectivity than ADHD participants.
      - Right thalamus showed higher connectivity with right precentral gyrus, right pars opercularis
        BA44, right postcentral gyrus, and right superior parietal lobule in autism compared with ADHD.
      - Left thalamus showed higher connectivity with right precentral gyrus in autism compared with ADHD.
      - ADHD > neurotypical did not produce significant clusters for either thalamus seed.
