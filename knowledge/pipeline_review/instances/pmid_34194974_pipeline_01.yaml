review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Functional MRI Tasks
  - Anatomical (3DT1) data analysis
  - fMRI data analysis
  - Functional connectivity analysis
  provisional_pipeline_count: 1
  split_decision: keep_parallel_structural_task_activation_and_connectivity_branches
  confirmed_structure:
  - CAT12 morphometry, SPM12 task activation and CONN 18.a task connectivity form three linked analysis
    branches.
  - Eight dorsal-attention and frontoparietal seeds feed condition-weighted seed-to-voxel correlation
    maps across three cognitive tasks.
  - Task activation helps select the networks used for connectivity but the connectivity model is weighted
    correlation rather than PPI.
  unresolved:
  - CAT12 and MATLAB versions, ART thresholds and exact condition regressors exported to CONN are not
    reported.
  - Several activation findings are only reported at liberal uncorrected thresholds and must not drive
    automatic seed recommendations without warning.
  discrepancies:
  - The task-connectivity branch uses HRF-weighted bivariate correlation, not a PPI interaction model.
  rejected_components:
  - conn_preprocessing
  - ppi_or_gppi
