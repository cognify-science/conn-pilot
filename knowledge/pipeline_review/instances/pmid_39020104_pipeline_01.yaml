review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Data preprocessing
  - Data analysis
  provisional_pipeline_count: 1
  split_decision: keep_roi_matrix_with_clustered_network_inference
  confirmed_structure:
  - FSL topup fieldmaps feed CONN 21.a fieldmap-aware preprocessing and default aCompCor denoising.
  - A 105-region Harvard-Oxford ROI matrix is hierarchically clustered using connectivity and anatomical
    proximity.
  - Clustered ROIs define network-to-network groups tested with an MVPA omnibus statistic and FDR correction.
  unresolved:
  - The data-derived clustering solution must be persisted as a run artifact rather than treated as a
    fixed atlas.
  - Post-hoc connection tests are uncorrected and must remain distinguishable from the corrected omnibus
    inference.
  discrepancies:
  - The analysis uses hierarchical network clustering and network-to-network inference, not graph-theory
    metrics.
  rejected_components:
  - graph_theory
