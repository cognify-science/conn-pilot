review:
  source_review_status: structural_methods_verified
  legacy_schema_shape: canonical_extraction
  split_into_multiple_instances: false
  notes:
  - Normalized from a legacy extraction, not re-verified against the publication.
  - A reviewer must decide whether branches represent separate pipeline instances.
  source_sections:
  - Brain image preprocessing and analysis
  - Statistical analysis
  - Degree
  - Betweenness centrality
  - Global efficiency
  - Local efficiency
  provisional_pipeline_count: 1
  split_decision: keep_roi_matrix_with_graph_metrics
  confirmed_structure:
  - CONN 20b preprocessing and denoising feed a Harvard-Oxford whole-brain ROI-to-ROI matrix.
  - The ROI matrix feeds degree, betweenness centrality, global efficiency and local efficiency calculations
    in CONN.
  - Age, sex and IQ-adjusted group comparisons use FDR correction and identify candidate network hubs.
  unresolved:
  - The exact graph edge threshold and treatment of negative weights are not reported clearly enough for
    reproduction.
  - Sedative administration for excessive movement is mentioned without sufficient detail to model its
    potential effect.
  discrepancies:
  - The graph family is confirmed, but the reusable graph contract still lacks threshold and signed-edge
    semantics.
  rejected_components:
  - dynamic_connectivity
