name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -q
      - run: python scripts/package_plugin.py

  parameter-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conn_pilot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conn_pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONN_PILOT_TEST_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/conn_pilot_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_parameter_postgres.py -v
