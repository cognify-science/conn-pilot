[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conn-pilot"
version = "0.1.0"
description = "Local deterministic engine for validated CONN analyses"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
conn-pilot = "conn_pilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

